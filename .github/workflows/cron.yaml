name: Recruiter Outreach Cron (Evening IST)

on:
  schedule:
    # Starts at 11:30 AM UTC (5:00 PM IST)
    - cron: '30 11 * * *'
    # Runs every 5 minutes from 12:00 PM to 1:00 PM UTC (5:30 PM to 6:30 PM IST)
    - cron: '*/5 12 * * *'
    # Runs every 5 minutes until 1:30 PM UTC (7:00 PM IST)
    - cron: '0-30 13 * * *'
  workflow_dispatch: 

jobs:
  trigger-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: |
          curl -s https://email-backend-zca0.onrender.com/ > /dev/null
          echo "Waking up server..."
          sleep 30

      - name: Send One Email
        run: |
          curl -X POST https://email-backend-zca0.onrender.com/send-one \
          -H "Content-Type: application/json"
          
      - name: Check for New Replies
        run: |
          curl -X POST https://email-backend-zca0.onrender.com/check-replies \
          -H "Content-Type: application/json"